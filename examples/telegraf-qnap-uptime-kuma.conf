# Telegraf drop-in: Uptime Kuma heartbeat only.
# Install as: /etc/telegraf/telegraf.d/42-qnap-uptime-kuma.conf

[[inputs.exec]]
  interval = "30s"
  name_override = "uptime_kuma_push"
  commands = ["/bin/curl -sS 'https://__UPTIME_KUMA_HOST__/api/push/__UPTIME_KUMA_PUSH_TOKEN__?status=up&msg=OK&ping=$(date +%s)'"]
  timeout = "15s"
  data_format = "value"
  data_type = "string"
  ignore_error = true
