# Telegraf drop-in: custom QNAP metrics only.
# Install as: /etc/telegraf/telegraf.d/41-qnap-metrics.conf

# QNAP custom collector (line protocol output).
[[inputs.exec]]
  interval = "60s"
  commands = ["/mnt/HDA_ROOT/bin/qnap-collector.sh"]
  timeout = "30s"
  data_format = "influx"
  ignore_error = false

# NVIDIA metrics via QPKG wrapper.
# Wrapper script should exist at /mnt/HDA_ROOT/bin/nvidia-smi-wrapper
[[inputs.nvidia_smi]]
  bin_path = "/mnt/HDA_ROOT/bin/nvidia-smi-wrapper"
  timeout = "5s"
