# Telegraf drop-in: SMART + network interface health metrics.
# Install as: /etc/telegraf/telegraf.d/43-qnap-smart-net.conf

# SMART disk health (QNAP smartctl path).
[[inputs.smartctl]]
  path = "/opt/sbin/smartctl"
  timeout = "60s"
  # Prevent spinning up sleeping disks.
  nocheck = "standby"

# NIC driver-level counters (drops/errors/link flaps depending on driver support).
[[inputs.ethtool]]
  interface_include = ["eth0", "eth1", "qvs0"]
  down_interfaces = "skip"
  normalize_keys = ["snakecase", "trim", "lower", "underscore"]
