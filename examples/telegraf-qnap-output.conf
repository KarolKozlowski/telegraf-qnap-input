# Telegraf drop-in: outputs only.
# Install as: /etc/telegraf/telegraf.d/40-qnap-output.conf

[global_tags]
  host = "__TELEGRAF_HOST_FQDN__"

[[outputs.postgresql]]
  # Replace __REPLACE_WITH_REAL_PASSWORD__ manually on the NAS.
  connection = "host=postgres.np.dotnot.pl user=telegraf password='__REPLACE_WITH_REAL_PASSWORD__' dbname=telegraf sslmode=require"
  create_templates = [
    '''CREATE TABLE IF NOT EXISTS {{ .table }} ({{ .allColumns }})''',
    '''SELECT ensure_metrics_hypertable({{ .table|quoteLiteral }})''',
    '''ALTER TABLE {{ .table }} SET WITHOUT CLUSTER''',
  ]
